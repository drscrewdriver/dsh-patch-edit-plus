# CI baseline for dsh-patch-edit-plus - npm variant (remote main ships package-lock.json only).
# Generated 2026-11-05 (v2: switched from pnpm to npm after cloud run showed
# the working-tree pnpm-lock.yaml was never committed to main).

name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run smoke